name: Lint Project
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install Project
        run: npm install

      - name: Run Lint Check
        run: npm run lint
