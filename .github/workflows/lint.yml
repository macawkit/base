name: Lint Project
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Project
        run: bun install --frozen-lockfile

      - name: Run Lint Check
        run: bun run lint
