name: Run Checks
on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      node-version:
        description: "A version of Node.js the project should be tested for"
        type: string
        default: "latest"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  node-consumer:
    name: Node ${{ inputs.node-version }} consumer check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install and build
        run: bun install --frozen-lockfile && bun run build

      - name: Verify Node can import built package
        run: node --input-type=module -e "import { Base, Signal } from './dist/index.js'; const b = new Base(); console.log(b.className);"
